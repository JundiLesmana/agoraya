name: Feature / enhancement
description: Propose a bounded product behavior change
title: "[ENHANCEMENT] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
      description: Explain the user or operational problem, not just the desired implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should a user be able to do or understand?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable statements.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Unauthorized users cannot ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicitly state what must not change.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - MUST / release blocker
        - SHOULD / valuable
        - COULD / stretch
        - Research only
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and risks
      description: Mention auth/tenant isolation, privacy, DB migration, API contract, email/provider, performance, and deployment impacts where relevant.
  - type: textarea
    id: test_plan
    attributes:
      label: Test plan
      description: Unit, integration/security-negative, E2E/manual preview checks.
    validations:
      required: true
