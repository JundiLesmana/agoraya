name: Bug report
description: Report a reproducible defect in GovHub.ID
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, OTPs, session cookies, full NIK, or unredacted citizen data."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Describe the observable problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps, test account role, and tenant context (use synthetic IDs).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Vercel Preview
        - Staging / development
        - Production
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 - Critical security/data loss/outage
        - P1 - Core flow blocked
        - P2 - Important defect with workaround
        - P3 - Minor defect
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and logs (redacted)
      description: Include request/correlation ID, timestamps, screenshots without PII, and failing command if available.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How can QA prove this is fixed?
    validations:
      required: true
