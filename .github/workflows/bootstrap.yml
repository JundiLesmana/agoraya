name: Bootstrap Production
on: workflow_dispatch
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      BOOTSTRAP_TENANT_NAME: ${{ secrets.BOOTSTRAP_TENANT_NAME }}
      BOOTSTRAP_TENANT_SLUG: ${{ secrets.BOOTSTRAP_TENANT_SLUG }}
      BOOTSTRAP_EXECUTIVE_EMAIL: ${{ secrets.BOOTSTRAP_EXECUTIVE_EMAIL }}
      BOOTSTRAP_EXECUTIVE_NAME: ${{ secrets.BOOTSTRAP_EXECUTIVE_NAME }}
      BOOTSTRAP_EXECUTIVE_PASSWORD: ${{ secrets.BOOTSTRAP_EXECUTIVE_PASSWORD }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      BOOTSTRAP_CITIZEN_EMAIL: ${{ secrets.BOOTSTRAP_CITIZEN_EMAIL }}
      BOOTSTRAP_CITIZEN_NAME: ${{ secrets.BOOTSTRAP_CITIZEN_NAME }}
      BOOTSTRAP_CITIZEN_PASSWORD: ${{ secrets.BOOTSTRAP_CITIZEN_PASSWORD }}
      BOOTSTRAP_KYC_CITIZEN_EMAIL: ${{ secrets.BOOTSTRAP_KYC_CITIZEN_EMAIL }}
      BOOTSTRAP_KYC_CITIZEN_NAME: ${{ secrets.BOOTSTRAP_KYC_CITIZEN_NAME }}
      BOOTSTRAP_KYC_CITIZEN_PASSWORD: ${{ secrets.BOOTSTRAP_KYC_CITIZEN_PASSWORD }}
      BOOTSTRAP_KYC_ASN_EMAIL: ${{ secrets.BOOTSTRAP_KYC_ASN_EMAIL }}
      BOOTSTRAP_KYC_ASN_NAME: ${{ secrets.BOOTSTRAP_KYC_ASN_NAME }}
      BOOTSTRAP_KYC_ASN_PASSWORD: ${{ secrets.BOOTSTRAP_KYC_ASN_PASSWORD }}
      BOOTSTRAP_APBD_EMAIL: ${{ secrets.BOOTSTRAP_APBD_EMAIL }}
      BOOTSTRAP_APBD_NAME: ${{ secrets.BOOTSTRAP_APBD_NAME }}
      BOOTSTRAP_APBD_PASSWORD: ${{ secrets.BOOTSTRAP_APBD_PASSWORD }}
      BOOTSTRAP_OPERATOR_EMAIL: ${{ secrets.BOOTSTRAP_OPERATOR_EMAIL }}
      BOOTSTRAP_OPERATOR_NAME: ${{ secrets.BOOTSTRAP_OPERATOR_NAME }}
      BOOTSTRAP_OPERATOR_PASSWORD: ${{ secrets.BOOTSTRAP_OPERATOR_PASSWORD }}
      BOOTSTRAP_VERIFIKATOR_EMAIL: ${{ secrets.BOOTSTRAP_VERIFIKATOR_EMAIL }}
      BOOTSTRAP_VERIFIKATOR_NAME: ${{ secrets.BOOTSTRAP_VERIFIKATOR_NAME }}
      BOOTSTRAP_VERIFIKATOR_PASSWORD: ${{ secrets.BOOTSTRAP_VERIFIKATOR_PASSWORD }}
      BOOTSTRAP_CMS_OPERATOR_EMAIL: ${{ secrets.BOOTSTRAP_CMS_OPERATOR_EMAIL }}
      BOOTSTRAP_CMS_OPERATOR_NAME: ${{ secrets.BOOTSTRAP_CMS_OPERATOR_NAME }}
      BOOTSTRAP_CMS_OPERATOR_PASSWORD: ${{ secrets.BOOTSTRAP_CMS_OPERATOR_PASSWORD }}
      BOOTSTRAP_ASN_OPERATOR_EMAIL: ${{ secrets.BOOTSTRAP_ASN_OPERATOR_EMAIL }}
      BOOTSTRAP_ASN_OPERATOR_NAME: ${{ secrets.BOOTSTRAP_ASN_OPERATOR_NAME }}
      BOOTSTRAP_ASN_OPERATOR_PASSWORD: ${{ secrets.BOOTSTRAP_ASN_OPERATOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:bootstrap:production
EOF